name: Refresh FE-46 admin goldens

on:
  push:
    branches:
      - feat/581-testnet-health-console

permissions:
  contents: write

env:
  NEXT_PUBLIC_QUICKEX_API_URL: 'https://api.quickex.test'
  NEXT_PUBLIC_STELLAR_NETWORK: 'testnet'
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  NEXT_PUBLIC_ERROR_REPORTING_ENABLED: 'false'
  NEXT_PUBLIC_APP_VERSION: 'e2e-theme-regression'

jobs:
  refresh-admin-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/581-testnet-health-console
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: npm install --no-package-lock
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
      - name: Start app and refresh admin snapshots
        working-directory: app/frontend
        env:
          QUICKEX_INTERNAL_API_URL: 'http://localhost:3000'
        run: |
          npm start &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000 && break
            test "$i" -lt 60 || exit 1
            sleep 1
          done
          cd ../../e2e
          npm install
          npx playwright test --project=visual-theme --grep "admin console renders controls, health and audit logs" --update-snapshots
      - name: Commit refreshed admin goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/theme-regression.spec.ts-snapshots/admin-dark-visual-theme-linux.png
          git add e2e/tests/theme-regression.spec.ts-snapshots/admin-light-visual-theme-linux.png
          if git diff --cached --quiet; then
            echo "Admin goldens are already current"
            exit 0
          fi
          git commit -m "test: refresh admin theme regression goldens"
          git push origin HEAD:feat/581-testnet-health-console
